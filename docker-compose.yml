services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-twiliochat}:${POSTGRES_PASSWORD:-twiliochat}@db:5432/${POSTGRES_DB:-twiliochat}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/data/media
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twiliochat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twiliochat}
      POSTGRES_DB: ${POSTGRES_DB:-twiliochat}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twiliochat}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  media:
